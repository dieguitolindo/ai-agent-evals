name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Also run the live evals (uses the ANTHROPIC_API_KEY secret, costs money)"
        type: boolean
        default: false

jobs:
  tests:
    name: Offline tests (no API, no cost)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  evals:
    name: Live evals (manual)
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m evals.run claude-haiku-5-5
      - run: cat evals/results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
